name: Build OneBookOS Live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'overlay/**'
      - 'branding/**'
      - 'tests/**'
      - '.github/workflows/build-iso.yml'

concurrency:
  group: obos-iso-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Free build space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/powershell /opt/ghc || true
          df -h .
      - name: Install build dependencies
        run: sudo bash build/install-deps.sh
      - name: Validate build scripts
        run: |
          bash -n build/install-deps.sh build/build-iso.sh build/smoke-test.sh
          shellcheck build/install-deps.sh build/build-iso.sh build/smoke-test.sh
          python3 tests/validate.py
          node --input-type=module --check < overlay/usr/share/gnome-shell/extensions/onebookos@nexora.tech/extension.js
      - name: Build Ubuntu Live ISO
        run: sudo bash build/build-iso.sh
      - name: Verify ISO and checksum
        run: |
          xorriso -indev dist/OneBookOS-0.2-gnome-live-amd64.iso -report_el_torito plain
          xorriso -indev dist/OneBookOS-0.2-gnome-live-amd64.iso -ls /casper
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Smoke test boot in QEMU
        run: bash build/smoke-test.sh dist/OneBookOS-0.2-gnome-live-amd64.iso
      - name: Publish tested alpha to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "alpha-0.2-gnome.${{ github.run_number }}" \
            dist/OneBookOS-0.2-gnome-live-amd64.iso dist/SHA256SUMS \
            --title "OneBookOS 0.2 GNOME Alpha — build ${{ github.run_number }}" \
            --prerelease \
            --notes "Experimental Ubuntu 24.04 Live image. Automated GNOME desktop and OneBook shell extension boot test passed. For VM testing only; not a tested installer."
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneBookOS-0.1-live-amd64
          path: |
            dist/OneBookOS-0.2-gnome-live-amd64.iso
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
