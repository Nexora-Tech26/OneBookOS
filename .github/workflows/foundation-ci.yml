name: OneBookOS Foundation CI

on:
  push:
    branches: [onebookui-rewrite]
    paths:
      - architecture/**
      - docs/**
      - tests/test_foundation.py
      - CONTRIBUTING.md
      - .github/workflows/foundation-ci.yml
  pull_request:
    paths:
      - architecture/**
      - docs/**
      - tests/test_foundation.py
      - CONTRIBUTING.md
      - .github/workflows/foundation-ci.yml

permissions:
  contents: read

jobs:
  foundation:
    name: Verify stage 1 (no ISO build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run standard-library architecture tests
        run: python3 -m unittest discover -s tests -p test_foundation.py -v
      - name: Check existing shell script syntax
        run: bash -n build/*.sh onebookui/build/*.sh
      - name: Check existing Wayland preview Python syntax
        run: |
          python3 -m py_compile onebookui/overlay/usr/local/bin/onebook-shell
          python3 -m py_compile onebookui/overlay/usr/local/bin/onebook-display
      - name: Explain assurance level
        run: echo "Foundation source checks passed. No ISO, GUI, installer or hardware tests run."
