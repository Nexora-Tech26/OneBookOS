name: OneBookUI Wayland Preview ISO and QEMU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'onebookui/**'
      - '.github/workflows/onebookui-iso.yml'
      - 'branding/wallpaper.svg'
      - 'overlay/usr/share/gnome-shell/extensions/onebookos@nexora.tech/icons/**'

permissions:
  contents: read

concurrency:
  group: onebookui-wayland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Inspect build space
        run: df -h .
      - name: Restore package-only Ubuntu rootfs cache
        uses: actions/cache@v4
        with:
          path: .onebookui-cache/base-rootfs.tar.zst
          key: onebookui-noble-amd64-base-zstd-v1-${{ hashFiles('onebookui/build/base-packages.txt') }}
      - name: Install ISO tools and QEMU
        run: sudo bash onebookui/build/install-deps.sh
      - name: Syntax and structural checks
        run: |
          bash -n onebookui/build/*.sh onebookui/overlay/usr/local/bin/onebook-session onebookui/overlay/usr/local/bin/onebook-gui-smoke onebookui/overlay/usr/local/bin/onebook-gui-autologin-smoke onebookui/overlay/usr/local/bin/onebook-compositor-qa-apps onebookui/overlay/etc/xdg/labwc/autostart
          shellcheck -e SC2016 onebookui/build/*.sh onebookui/overlay/usr/local/bin/onebook-session onebookui/overlay/usr/local/bin/onebook-gui-smoke onebookui/overlay/etc/xdg/labwc/autostart
          python3 -m py_compile onebookui/overlay/usr/local/bin/onebook-shell onebookui/overlay/usr/local/bin/onebook-files onebookui/overlay/usr/local/bin/onebook-display
          python3 onebookui/overlay/usr/local/bin/onebook-display --self-test
          python3 -m py_compile onebookui/build/qemu-screenshot.py
          python3 onebookui/build/qemu-screenshot.py --self-test
          python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("onebookui/overlay/etc/xdg/labwc/rc.xml").getroot(); assert r.findtext("./theme/name") == "OneBookUI"; assert r.find("./theme/titlebar") is not None'
          test -s onebookui/overlay/usr/share/themes/OneBookUI/gtk-3.0/gtk.css
          test -s onebookui/overlay/usr/share/themes/OneBookUI/openbox-3/themerc
          python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("onebookui/overlay/etc/xdg/labwc/rc.xml").getroot(); assert len(r.findall("./desktops/names/name")) == 4; assert r.find("./mouse/default") is not None; assert any(k.get("key") == "W-Left" for k in r.findall("./keyboard/keybind")); print("Compositor workspace/mouse/snap configuration: OK")'
          python3 -c 'import tomllib; c=tomllib.load(open("onebookui/overlay/etc/greetd/config.toml","rb")); assert c["initial_session"] == {"command": "/usr/local/bin/onebook-session", "user": "obos"}; assert c["default_session"] == {"command": "/usr/local/bin/onebook-session", "user": "obos"}; print("Live auto-login and fallback configuration: OK")'
      - name: Build native Wayland Live ISO
        run: sudo bash onebookui/build/build-iso.sh
      - name: Verify boot image and checksum
        run: |
          xorriso -indev dist/OneBookOS-OneBookUI-0.3-preview-amd64.iso -report_el_torito plain
          xorriso -indev dist/OneBookOS-OneBookUI-0.3-preview-amd64.iso -ls /casper
          (cd dist && sha256sum -c SHA256SUMS-onebookui)
      - name: Permit QEMU to save framebuffer QA beside root-built ISO
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          test -w dist
      - name: Verify Wayland and graphical desktop in parallel QEMU sessions
        run: |
          bash onebookui/build/test-qemu.sh dist/OneBookOS-OneBookUI-0.3-preview-amd64.iso headless > "$RUNNER_TEMP/obos-headless.log" 2>&1 &
          a=$!
          bash onebookui/build/test-qemu.sh dist/OneBookOS-OneBookUI-0.3-preview-amd64.iso graphical > "$RUNNER_TEMP/obos-graphical.log" 2>&1 &
          b=$!
          set +e
          wait "$a"; result_a=$?
          wait "$b"; result_b=$?
          set -e
          cat "$RUNNER_TEMP/obos-headless.log"
          cat "$RUNNER_TEMP/obos-graphical.log"
          test "$result_a" -eq 0 && test "$result_b" -eq 0
      - name: Upload graphical QEMU screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OneBookUI-Part2-compositor-QA
          path: |
            dist/OneBookUI-graphical-qemu.png
            ${{ runner.temp }}/obos-headless.log
            ${{ runner.temp }}/obos-graphical.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: OneBookOS-OneBookUI-0.3-preview-amd64
          path: |
            dist/OneBookOS-OneBookUI-0.3-preview-amd64.iso
            dist/SHA256SUMS-onebookui
          if-no-files-found: error
          retention-days: 7
