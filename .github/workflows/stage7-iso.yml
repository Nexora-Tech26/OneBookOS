name: Stage 07 — Wallpaper and Widgets Live ISO

on:
  push:
    branches: [feature/stage-07-wallpaper-widgets]
    paths:
      - onebookui/**
      - ui-kit/**
      - branding/**
      - display-engine/**
      - tests/**
      - .github/workflows/stage7-iso.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      # Explicit restore + save: a later QEMU failure must never lose the
      # expensive Ubuntu base. Increment 'v3' if the package recipe changes.
      - name: Restore Ubuntu 24.04 package-only rootfs
        id: rootfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .onebookui-cache/base-rootfs.tar.zst
          key: onebookos-noble-amd64-rootfs-v3-${{ hashFiles('onebookui/build/base-packages.txt') }}
      - name: Report base cache state
        run: |
          if [ "${{ steps.rootfs-cache.outputs.cache-hit }}" = true ]; then
            echo 'CACHE HIT: skip debootstrap and apt package installation'
          else
            echo 'CACHE MISS: first build prepares and saves the Ubuntu package base'
          fi
      - name: Install QEMU and builder
        run: sudo bash onebookui/build/install-deps.sh
      - name: Validate wallpaper, widget code, existing shell and recovery regressions
        run: |
          set -euo pipefail
          python3 ui-kit/build.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile onebookui/overlay/usr/local/bin/onebook-widgets onebookui/overlay/usr/local/bin/onebook-shell
          bash -n onebookui/build/*.sh display-engine/*.sh onebookui/overlay/usr/local/bin/onebook-widgets-smoke
      - name: Build OneBookOS 0.1.7 Live ISO
        run: |
          echo "ISO_BUILD_STARTED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          time sudo bash display-engine/build-stage7-iso.sh
      # Save BEFORE any QEMU smoke tests. Even a failed UI test retains the
      # reusable package base for the next run on this branch.
      - name: Check generated rootfs cache is readable
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          test -s .onebookui-cache/base-rootfs.tar.zst
          sudo chmod a+r .onebookui-cache/base-rootfs.tar.zst
          ls -lh .onebookui-cache/base-rootfs.tar.zst
      - name: Save package rootfs cache immediately
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .onebookui-cache/base-rootfs.tar.zst
          key: ${{ steps.rootfs-cache.outputs.cache-primary-key }}
      - name: Verify GRUB layout and ISO SHA256
        run: |
          set -euo pipefail
          ISO=dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso
          xorriso -indev "$ISO" -report_el_torito plain
          xorriso -indev "$ISO" -ls /casper
          (cd dist && sha256sum -c SHA256SUMS-stage7)
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Baseline headless compositor regression
        run: |
          set -o pipefail
          bash onebookui/build/test-qemu.sh dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso headless labwc 2>&1 | tee dist/stage7-headless.log
      - name: Real default wallpaper and widgets screenshot
        run: |
          set -o pipefail
          bash onebookui/build/test-qemu.sh dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso widgets labwc 2>&1 | tee dist/stage7-widgets.log
      - name: Real widget manager customization screenshot
        run: |
          set -o pipefail
          bash onebookui/build/test-qemu.sh dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso widgets-manager labwc 2>&1 | tee dist/stage7-customize.log
      - name: Legacy expanded Notch regression
        run: |
          set -o pipefail
          bash onebookui/build/test-qemu.sh dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso notch labwc 2>&1 | tee dist/stage7-notch.log
      - name: Legacy shell recovery regression
        run: |
          set -o pipefail
          bash onebookui/build/test-qemu.sh dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso recovery labwc 2>&1 | tee dist/stage7-recovery.log
      - name: Store real QEMU screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OneBookOS-Stage07-Real-QEMU-Screenshots
          path: |
            dist/*qemu.png
            dist/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish ISO only after all QEMU tests
        uses: actions/upload-artifact@v4
        with:
          name: OneBookOS-Stage07-Live-ISO
          path: |
            dist/OneBookOS-0.1.7-Wallpaper-Widgets-DeveloperPreview-amd64.iso
            dist/SHA256SUMS-stage7
          if-no-files-found: error
          retention-days: 7
