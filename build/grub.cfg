set default=0
set timeout=5
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry 'Start OneBookOS Live Alpha' {
 linux /casper/vmlinuz boot=casper live-media-path=/casper console=tty0 console=ttyS0,115200n8 username=obos hostname=onebookos quiet ---
 initrd /casper/initrd
}
menuentry 'OneBookOS Live - safe graphics' {
 linux /casper/vmlinuz boot=casper live-media-path=/casper console=tty0 console=ttyS0,115200n8 username=obos hostname=onebookos nomodeset ---
 initrd /casper/initrd
}
menuentry 'OneBookOS Live - diagnostics' {
 linux /casper/vmlinuz boot=casper live-media-path=/casper console=tty0 console=ttyS0,115200n8 username=obos hostname=onebookos systemd.show_status=1 ---
 initrd /casper/initrd
}
