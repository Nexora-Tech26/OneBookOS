set default=0
set timeout=8

menuentry 'Start OneBookOS Live Alpha' {
 linux /casper/vmlinuz boot=casper username=obos hostname=onebookos quiet ---
 initrd /casper/initrd
}
menuentry 'OneBookOS Live - safe graphics' {
 linux /casper/vmlinuz boot=casper username=obos hostname=onebookos nomodeset ---
 initrd /casper/initrd
}
menuentry 'OneBookOS Live - diagnostics' {
 linux /casper/vmlinuz boot=casper username=obos hostname=onebookos systemd.show_status=1 ---
 initrd /casper/initrd
}
