# Boot the OneBookUI desktop automatically; hold Shift or press Esc for GRUB.
set default=0
set timeout_style=hidden
set timeout=1
terminal_input console
terminal_output console
menuentry 'OneBookOS — OneBookUI Desktop (Live)' {
 linux /casper/vmlinuz boot=casper live-media-path=/casper username=obos hostname=onebookos console=tty0 quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0 ---
 initrd /casper/initrd
}
menuentry 'OneBookOS — Recovery / Safe graphics' {
 linux /casper/vmlinuz boot=casper live-media-path=/casper username=obos hostname=onebookos console=tty0 nomodeset ---
 initrd /casper/initrd
}
menuentry 'OneBookOS — QEMU headless Wayland diagnostic' {
 linux /casper/vmlinuz boot=casper live-media-path=/casper username=obos hostname=onebookos console=tty0 console=ttyS0,115200n8 obos.test=1 ---
 initrd /casper/initrd
}
