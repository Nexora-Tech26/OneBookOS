# Stage 2 — alternative experimental compositor in the SAME Live ISO.
# Default boot still selects labwc. Blur disabled until GPU and thermal tests.
[core]
plugins = autostart command animate move resize place decoration grid foreign-toplevel gtk-shell wm-actions switcher vswitch
vwidth = 2
vheight = 2
close_top_view = <super> KEY_Q | <alt> KEY_F4

[autostart]
autostart_wf_shell = false
background = swaybg -c '#bedafa' -i /usr/share/backgrounds/onebookos/wallpaper.png -m fill
display = /usr/local/bin/onebook-display
shell = /usr/local/bin/onebook-shell
qa = /usr/local/bin/onebook-compositor-qa-apps

[animate]
open_animation = fade
close_animation = fade
duration = 180
fade_duration = 180

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot

[grid]
duration = 180
